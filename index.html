<script>
/* =====================================================
   CONTADOR DE PRUEBA — 5 MINUTOS
   Se reinicia cada vez que se abre o recarga la página
===================================================== */

const TEST_DURATION = 5 * 60; // 5 minutos

let remainingSeconds = TEST_DURATION;
let countdownTimer = null;

const countdownScreen =
    document.getElementById("countdownScreen");

const countdownContent =
    document.getElementById("countdownContent");

const unlockMessage =
    document.getElementById("unlockMessage");

const daysElement =
    document.getElementById("days");

const hoursElement =
    document.getElementById("hours");

const minutesElement =
    document.getElementById("minutes");

const secondsElement =
    document.getElementById("seconds");


function updateCountdown() {

    const days =
        Math.floor(remainingSeconds / 86400);

    const hours =
        Math.floor(
            (remainingSeconds % 86400) / 3600
        );

    const minutes =
        Math.floor(
            (remainingSeconds % 3600) / 60
        );

    const seconds =
        remainingSeconds % 60;


    daysElement.textContent =
        String(days).padStart(2, "0");

    hoursElement.textContent =
        String(hours).padStart(2, "0");

    minutesElement.textContent =
        String(minutes).padStart(2, "0");

    secondsElement.textContent =
        String(seconds).padStart(2, "0");


    if (remainingSeconds <= 0) {

        unlockPage();

        return;
    }

    remainingSeconds--;
}


function unlockPage() {

    clearInterval(countdownTimer);

    daysElement.textContent = "00";
    hoursElement.textContent = "00";
    minutesElement.textContent = "00";
    secondsElement.textContent = "00";


    countdownContent.classList.add("fade");

    unlockMessage.classList.add("show");


    setTimeout(() => {

        countdownScreen.classList.add("hidden");

        document.body.classList.remove("locked");

    }, 3500);
}


/* Iniciar contador */
updateCountdown();

countdownTimer = setInterval(
    updateCountdown,
    1000
);
</script>
